name: Publish tested v0.9.10 package once
on:
  push:
    branches: [release-v0.9.10-source]
    paths: ['.github/workflows/dispatch-v0.9.10.yml']
permissions:
  actions: write
  contents: write
jobs:
  dispatch:
    runs-on: ubuntu-24.04
    steps:
      - name: Publish the successful tested artifact
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run release-vps.yml --ref main -f run_id=43124202899 -f tag=v0.9.10
