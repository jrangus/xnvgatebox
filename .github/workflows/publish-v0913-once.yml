name: Publish v0.9.13 once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-v0913-once.yml

permissions:
  actions: write
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Test, package, and publish v0.9.13
        shell: bash
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          gh workflow run vps.yml --ref main -f version=v0.9.13 -f live_mirror=false

          run_id=""
          for _ in $(seq 1 40); do
            run_id="$(gh run list --workflow vps.yml --event workflow_dispatch --branch main --limit 30 \
              --json databaseId,headSha \
              --jq '.[] | select(.headSha == "'"$source_sha"'") | .databaseId' | head -n 1)"
            [[ -n "$run_id" ]] && break
            sleep 3
          done
          [[ "$run_id" =~ ^[0-9]+$ ]]
          gh run watch "$run_id" --exit-status

          gh workflow run release-vps.yml --ref main -f run_id="$run_id" -f tag=v0.9.13
          release_id=""
          for _ in $(seq 1 40); do
            release_id="$(gh run list --workflow release-vps.yml --event workflow_dispatch --branch main --limit 30 \
              --json databaseId,headSha \
              --jq '.[] | select(.headSha == "'"$source_sha"'") | .databaseId' | head -n 1)"
            [[ -n "$release_id" ]] && break
            sleep 3
          done
          [[ "$release_id" =~ ^[0-9]+$ ]]
          gh run watch "$release_id" --exit-status
