name: Publish v0.9.7 once

on:
  push:
    paths:
      - .github/workflows/publish-v097-once.yml

permissions:
  actions: write
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE_SHA: 94154917da8955838289d2994249ae91ceb9fff0
      RELEASE_TAG: v0.9.7
    steps:
      - name: Run tested package workflow and publish its artifact
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run vps.yml --ref "$SOURCE_SHA" -f version="$RELEASE_TAG" -f live_mirror=false
          RUN_ID=""
          for attempt in $(seq 1 30); do
            RUN_ID="$(gh run list --workflow vps.yml --event workflow_dispatch --commit "$SOURCE_SHA" --limit 10 --json databaseId --jq '.[0].databaseId // empty')"
            [[ -n "$RUN_ID" ]] && break
            sleep 5
          done
          [[ "$RUN_ID" =~ ^[0-9]+$ ]]
          echo "VPS package run: $RUN_ID"
          gh run watch "$RUN_ID" --exit-status
          gh workflow run release-vps.yml --ref main -f run_id="$RUN_ID" -f tag="$RELEASE_TAG"
          RELEASE_RUN=""
          for attempt in $(seq 1 30); do
            RELEASE_RUN="$(gh run list --workflow release-vps.yml --event workflow_dispatch --limit 10 --json databaseId --jq '.[0].databaseId // empty')"
            [[ -n "$RELEASE_RUN" ]] && break
            sleep 5
          done
          [[ "$RELEASE_RUN" =~ ^[0-9]+$ ]]
          echo "Release run: $RELEASE_RUN"
          gh run watch "$RELEASE_RUN" --exit-status
