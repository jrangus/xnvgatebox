name: Publish v0.9.12 once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-v0912-once.yml

permissions:
  actions: write
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: vps/fanout/go.mod

      - name: Apply verified SSTP promotion fix
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 -d > /tmp/v0912.patch
          git apply --check /tmp/v0912.patch
          git apply /tmp/v0912.patch
          (
            cd vps/fanout
            gofmt -w sstp_probe.go sstp_exit.go console_sstp.go console_sstp_test.go sstp_exit_test.go
            go test -c -o /tmp/xnvgatebox-v0912-tests
            sudo /tmp/xnvgatebox-v0912-tests
          )
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add vps/fanout
          git commit -m 'fix: explain SSTP promotion eligibility'
          git push origin HEAD:main
          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Test, package, and publish v0.9.12
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run vps.yml --ref main -f version=v0.9.12 -f live_mirror=false

          run_id=""
          for _ in $(seq 1 40); do
            run_id="$(gh run list --workflow vps.yml --event workflow_dispatch --branch main --limit 30 \
              --json databaseId,headSha \
              --jq '.[] | select(.headSha == env.SOURCE_SHA) | .databaseId' | head -n 1)"
            [[ -n "$run_id" ]] && break
            sleep 3
          done
          [[ "$run_id" =~ ^[0-9]+$ ]]
          echo "VPS_RUN_ID=$run_id"
          gh run watch "$run_id" --exit-status

          gh workflow run release-vps.yml --ref main -f run_id="$run_id" -f tag=v0.9.12
          release_id=""
          for _ in $(seq 1 40); do
            release_id="$(gh run list --workflow release-vps.yml --event workflow_dispatch --branch main --limit 30 \
              --json databaseId,headSha \
              --jq '.[] | select(.headSha == env.SOURCE_SHA) | .databaseId' | head -n 1)"
            [[ -n "$release_id" ]] && break
            sleep 3
          done
          [[ "$release_id" =~ ^[0-9]+$ ]]
          echo "RELEASE_RUN_ID=$release_id"
          gh run watch "$release_id" --exit-status
