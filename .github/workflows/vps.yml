name: VPS tests and package
on:
  push:
    paths: ['vps/**', 'src/**', 'config/**', 'tests/**', 'scripts/build_vps_package.py', 'scripts/install_mihomo_test.py', '.github/workflows/vps.yml']
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version; use an explicit vX.Y.Z for a release candidate'
        default: dev
        required: true
        type: string
      live_mirror:
        description: 'Also verify local Linux acquisition of the opt-in public mirror (external network required)'
        default: false
        required: false
        type: boolean
permissions:
  contents: read
jobs:
  vps:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache-dependency-path: vps/fanout/go.sum
      - run: python scripts/install_xray.py
      - run: python scripts/install_mihomo_test.py
      - run: |
          go test -c -o /tmp/xnvgatebox-tests
          sudo /tmp/xnvgatebox-tests -test.v
        working-directory: vps/fanout
      - name: Check diagnostic concurrency for races
        run: go test -race -run 'Test(Automation|Clash|ConnectBudget|ConnectObservations|CountryEvidence|ManualEntry|ThirdParty|Update|PoolRefresh|ConsoleDefaultTarget|ConsoleRefresh|ConsoleSource|PoolSource|Sstp|ExplicitHostDirect|PublicSocks|HostDirectSubscription|AccessStore|ShutdownPersistence|ShutdownWaits|NetworkLinks|Diagnostic128|ProductionNetwork|DynamicDiagnostic|Console128|ConsoleManual|ConsoleFullSource|ConsoleCheckSettings|ConsoleTwoWorkers|ConsoleCancellation|ConsoleParallelism|ConsoleCandidateQueue|ConsoleRunningCandidate|ConsoleShutdown|DiagnosticLease|CancelledProduction|DiagnosticBusy|CandidateReuse|Preflight|TCPPreflight)' ./...
        working-directory: vps/fanout
      - name: Verify uninstall with real isolated network resources
        run: sudo python3 tests/uninstall_linux.py
      - name: Verify uninstall stop and reset with real systemd
        run: sudo --preserve-env=GITHUB_ACTIONS python3 tests/uninstall_systemd.py
      - run: bash -n vps/install.sh vps/deploy/xnvgatebox
      - name: Build the package from this tested commit
        env:
          PACKAGE_VERSION: ${{ inputs.version || 'dev' }}
        run: |
          [[ "$PACKAGE_VERSION" =~ ^(dev|v[0-9]+\.[0-9]+\.[0-9]+)$ ]]
          python scripts/build_vps_package.py --version "$PACKAGE_VERSION"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: xnvgatebox-linux-amd64
          path: dist/

  distro-install:
    name: Install ${{ matrix.image }}
    needs: vps
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        image: ['debian:12', 'debian:13', 'ubuntu:22.04', 'ubuntu:24.04', 'quay.io/centos/centos:stream9', 'quay.io/centos/centos:stream10']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: xnvgatebox-linux-amd64
          path: dist/
      - run: bash tests/distro_install.sh "${{ matrix.image }}"
        env:
          XNV_TEST_CLIENT: ${{ matrix.image == 'debian:12' && 'mihomo' || '' }}

  mirror-source:
    if: github.event_name == 'workflow_dispatch' && inputs.live_mirror
    needs: vps
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python3 tests/live_mirror_builder.py
