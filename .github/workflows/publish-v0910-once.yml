name: Publish v0.9.10 once
on:
  push:
    paths:
      - .github/workflows/publish-v0910-once.yml
permissions:
  actions: write
  contents: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Publish tested artifact after source alignment
        run: |
          set -euo pipefail
          gh workflow run release-vps.yml --ref main -f run_id=43124202899 -f tag=v0.9.10
